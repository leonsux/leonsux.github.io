<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">从两组数据到一个线性模型</title>
  <desc id="desc">已知坐标点一三和二五，求出参数 a 等于二、b 等于一，再用模型预测新的输出。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#202733" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1262e8"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="32" fill="#f7f3eb"/>
  <circle cx="1098" cy="64" r="148" fill="#1262e8" opacity="0.06"/>
  <circle cx="83" cy="652" r="180" fill="#1262e8" opacity="0.04"/>

  <text x="70" y="69" fill="#1262e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="3">A TINY MODEL</text>
  <text x="70" y="125" fill="#1e252f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="42" font-weight="760">从两组数据，找到一条规律</text>
  <text x="70" y="165" fill="#677180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">先根据例子求出参数，再用参数预测新的结果</text>

  <g filter="url(#shadow)">
    <rect x="70" y="210" width="492" height="390" rx="28" fill="#fffdf8" stroke="#d7dbe2" stroke-width="2"/>
    <rect x="628" y="210" width="502" height="390" rx="28" fill="#202733"/>
  </g>

  <text x="106" y="257" fill="#677180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">KNOWN DATA</text>

  <path d="M 132 531 H 510" stroke="#aeb6c2" stroke-width="2"/>
  <path d="M 160 555 V 286" stroke="#aeb6c2" stroke-width="2"/>
  <path d="M 135 493 L 492 300" fill="none" stroke="#1262e8" stroke-width="5" stroke-linecap="round"/>

  <g fill="#8993a2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <text x="251" y="553" text-anchor="middle">1</text>
    <text x="341" y="553" text-anchor="middle">2</text>
    <text x="144" y="429" text-anchor="end">3</text>
    <text x="144" y="333" text-anchor="end">5</text>
    <text x="505" y="553">x</text>
    <text x="145" y="291">y</text>
  </g>

  <path d="M 251 531 V 429 H 160" fill="none" stroke="#c9ced6" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M 341 531 V 333 H 160" fill="none" stroke="#c9ced6" stroke-width="2" stroke-dasharray="6 7"/>
  <circle cx="251" cy="429" r="10" fill="#f7f3eb" stroke="#1262e8" stroke-width="5"/>
  <circle cx="341" cy="333" r="10" fill="#f7f3eb" stroke="#1262e8" stroke-width="5"/>
  <rect x="272" y="387" width="87" height="31" rx="15" fill="#e7edf7"/>
  <text x="315" y="408" text-anchor="middle" fill="#1262e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">(1, 3)</text>
  <rect x="360" y="292" width="87" height="31" rx="15" fill="#e7edf7"/>
  <text x="403" y="313" text-anchor="middle" fill="#1262e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">(2, 5)</text>

  <path d="M 576 405 H 612" stroke="#1262e8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <text x="670" y="257" fill="#91b6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">LEARN PARAMETERS</text>
  <text x="670" y="327" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="38" font-weight="700">y = ax + b</text>
  <path d="M 670 358 H 1088" stroke="#465160" stroke-width="2"/>

  <rect x="670" y="387" width="186" height="102" rx="20" fill="#2e3846"/>
  <text x="696" y="416" fill="#aeb8c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16">学到的参数</text>
  <text x="696" y="449" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700">a = 2</text>
  <text x="696" y="477" fill="#91b6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700">b = 1</text>

  <rect x="878" y="387" width="210" height="148" rx="20" fill="#1262e8"/>
  <text x="904" y="420" fill="#dbe8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16">遇到新输入</text>
  <text x="904" y="458" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700">x = 10</text>
  <path d="M 904 475 H 1060" stroke="#75a6ff" stroke-width="2"/>
  <text x="904" y="511" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700">y = 21</text>

  <rect x="670" y="556" width="418" height="26" rx="13" fill="#303b49"/>
  <circle cx="687" cy="569" r="5" fill="#5bd58c"/>
  <text x="701" y="575" fill="#b8c1ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15">训练找到参数，推理使用参数</text>
</svg>
