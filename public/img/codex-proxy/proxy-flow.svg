<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Codex 通过本地代理连接 OpenAI 的链路</title>
  <desc id="desc">Codex Desktop 通过本机 127.0.0.1:7897 代理端口连接 OpenAI 服务，避开不稳定的直连链路。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#202733" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1262e8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d55a54"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="32" fill="#f7f3eb"/>
  <circle cx="1088" cy="78" r="148" fill="#1262e8" opacity="0.06"/>
  <circle cx="114" cy="636" r="186" fill="#1262e8" opacity="0.04"/>

  <text x="72" y="73" fill="#1262e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" letter-spacing="3">CONNECTION PATH</text>
  <text x="72" y="132" fill="#1e252f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="42" font-weight="750">让 Codex 走一条稳定的连接链路</text>
  <text x="72" y="171" fill="#677180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">通过环境变量，把网络请求交给本机代理转发</text>

  <path d="M 276 242 C 474 183, 722 183, 924 242" fill="none" stroke="#d55a54" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12" marker-end="url(#arrow-red)"/>
  <rect x="463" y="188" width="274" height="42" rx="21" fill="#f7f3eb"/>
  <text x="600" y="216" text-anchor="middle" fill="#b44b47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">DIRECT · UNSTABLE</text>
  <circle cx="594" cy="213" r="19" fill="#f7f3eb" stroke="#d55a54" stroke-width="3"/>
  <path d="M 587 206 L 601 220 M 601 206 L 587 220" stroke="#d55a54" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="72" y="285" width="280" height="238" rx="28" fill="#202733"/>
    <rect x="460" y="285" width="280" height="238" rx="28" fill="#1262e8"/>
    <rect x="848" y="285" width="280" height="238" rx="28" fill="#fffdf8" stroke="#d7dbe2" stroke-width="2"/>
  </g>

  <rect x="112" y="329" width="80" height="64" rx="12" fill="#313b49" stroke="#6e7b8d" stroke-width="2"/>
  <circle cx="130" cy="347" r="4" fill="#5bd58c"/>
  <path d="M 128 369 L 142 379 L 128 389" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 150 389 H 173" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="112" y="436" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="750">Codex Desktop</text>
  <text x="112" y="474" fill="#aeb8c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">HTTP_PROXY</text>

  <path d="M 529 372 C 529 343, 551 321, 580 321 H 620 C 649 321, 671 343, 671 372 V 393 H 644 V 372 C 644 358, 634 348, 620 348 H 580 C 566 348, 556 358, 556 372 V 393 H 529 Z" fill="#ffffff" opacity="0.94"/>
  <rect x="512" y="381" width="176" height="20" rx="10" fill="#ffffff" opacity="0.94"/>
  <circle cx="600" cy="391" r="6" fill="#1262e8"/>
  <text x="600" y="436" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="750">本地代理</text>
  <text x="600" y="474" text-anchor="middle" fill="#dbe8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">127.0.0.1:7897</text>

  <path d="M 925 381 C 925 354, 947 333, 974 333 C 989 311, 1015 300, 1042 308 C 1069 316, 1085 341, 1082 368 C 1100 376, 1110 393, 1107 411 C 1104 431, 1087 445, 1067 445 H 963 C 940 445, 921 427, 921 404 C 921 396, 922 388, 925 381 Z" fill="#e8effc" stroke="#1262e8" stroke-width="3"/>
  <text x="988" y="436" text-anchor="middle" fill="#1e252f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="750">OpenAI</text>
  <text x="988" y="474" text-anchor="middle" fill="#677180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">SERVICE ENDPOINT</text>

  <path d="M 371 404 H 435" fill="none" stroke="#1262e8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M 759 404 H 823" fill="none" stroke="#1262e8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <text x="406" y="379" text-anchor="middle" fill="#1262e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">PROXY</text>
  <text x="794" y="379" text-anchor="middle" fill="#1262e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">HTTPS</text>

  <rect x="72" y="571" width="1056" height="48" rx="24" fill="#e7edf7"/>
  <circle cx="104" cy="595" r="8" fill="#1262e8"/>
  <text x="126" y="603" fill="#465262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">代理客户端需要保持运行，端口号以本机实际配置为准</text>
</svg>
