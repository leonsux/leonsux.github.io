<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Codex 连续五次重连示意图</title>
  <desc id="desc">终端风格的连接日志依次显示 Reconnecting…1/5 到 Reconnecting…5/5，用于示意 Codex 反复尝试重新连接。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#202733" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="32" fill="#f7f3eb"/>
  <circle cx="1110" cy="72" r="158" fill="#d85d56" opacity="0.06"/>
  <circle cx="80" cy="676" r="220" fill="#1262e8" opacity="0.05"/>

  <text x="78" y="78" fill="#1262e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" letter-spacing="3">CONNECTION RETRY</text>
  <text x="78" y="136" fill="#1e252f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="42" font-weight="750">连接正在反复重试</text>
  <text x="78" y="177" fill="#677180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">从 1/5 一直走到 5/5，任务响应也随之中断</text>

  <g filter="url(#shadow)">
    <rect x="78" y="222" width="1044" height="382" rx="26" fill="#202733"/>
  </g>
  <path d="M 78 248 C 78 234, 90 222, 104 222 H 1096 C 1110 222, 1122 234, 1122 248 V 286 H 78 Z" fill="#2b3441"/>
  <circle cx="116" cy="255" r="8" fill="#ff6b66"/>
  <circle cx="144" cy="255" r="8" fill="#f2c94c"/>
  <circle cx="172" cy="255" r="8" fill="#5bd58c"/>
  <text x="600" y="262" text-anchor="middle" fill="#c4cbd5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Codex Desktop · connection log</text>

  <line x1="167" y1="331" x2="167" y2="541" stroke="#3d4857" stroke-width="4" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <circle cx="167" cy="335" r="10" fill="#6e7b8d"/>
    <text x="212" y="344" fill="#aeb8c7" font-size="25">Reconnecting…1/5</text>
    <text x="1028" y="342" text-anchor="end" fill="#68768a" font-size="16">attempt 01</text>

    <circle cx="167" cy="385" r="10" fill="#728fc4"/>
    <text x="212" y="394" fill="#bdcbe0" font-size="25">Reconnecting…2/5</text>
    <text x="1028" y="392" text-anchor="end" fill="#68768a" font-size="16">attempt 02</text>

    <circle cx="167" cy="435" r="10" fill="#5f8fe4"/>
    <text x="212" y="444" fill="#c9d9f4" font-size="25">Reconnecting…3/5</text>
    <text x="1028" y="442" text-anchor="end" fill="#68768a" font-size="16">attempt 03</text>

    <circle cx="167" cy="485" r="10" fill="#f2a65a"/>
    <text x="212" y="494" fill="#f5c18f" font-size="25">Reconnecting…4/5</text>
    <text x="1028" y="492" text-anchor="end" fill="#8f765f" font-size="16">attempt 04</text>

    <circle cx="167" cy="535" r="10" fill="#ff6b66"/>
    <circle cx="167" cy="535" r="18" fill="none" stroke="#ff6b66" stroke-width="2" opacity="0.35"/>
    <text x="212" y="544" fill="#ff8b86" font-size="25" font-weight="700">Reconnecting…5/5</text>
    <text x="1028" y="542" text-anchor="end" fill="#d98b87" font-size="16">attempt 05</text>
  </g>
</svg>
