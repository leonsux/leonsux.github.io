<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Codex 代理环境变量配置示例</title>
  <desc id="desc">在用户目录的 .codex/.env 文件中配置 HTTP_PROXY 和 HTTPS_PROXY，并将它们指向本机 7897 端口。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#202733" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="32" fill="#f7f3eb"/>
  <path d="M 0 555 C 272 454, 520 650, 790 558 C 1000 486, 1102 523, 1200 561 V 675 H 0 Z" fill="#1262e8" opacity="0.05"/>
  <text x="78" y="82" fill="#1262e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" letter-spacing="3">CODEX CONFIG</text>
  <text x="78" y="139" fill="#1e252f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="41" font-weight="750">把代理地址写进 Codex 的环境文件</text>
  <text x="78" y="178" fill="#677180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">保存后完全退出并重新启动 Codex</text>

  <g filter="url(#shadow)">
    <rect x="78" y="226" width="1044" height="346" rx="25" fill="#202733"/>
  </g>
  <path d="M 78 251 C 78 237, 89 226, 103 226 H 1097 C 1111 226, 1122 237, 1122 251 V 286 H 78 Z" fill="#2b3441"/>
  <circle cx="116" cy="257" r="8" fill="#ff6b66"/>
  <circle cx="144" cy="257" r="8" fill="#f2c94c"/>
  <circle cx="172" cy="257" r="8" fill="#5bd58c"/>
  <text x="600" y="264" text-anchor="middle" fill="#c4cbd5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">~/.codex/.env</text>

  <rect x="111" y="321" width="978" height="164" rx="16" fill="#171d25"/>
  <text x="143" y="374" fill="#68768a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">1</text>
  <text x="143" y="438" fill="#68768a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">2</text>
  <line x1="188" y1="343" x2="188" y2="461" stroke="#303b49" stroke-width="2"/>
  <text x="224" y="374" fill="#7fb0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700">HTTP_PROXY</text>
  <text x="400" y="374" fill="#aeb8c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">=</text>
  <text x="424" y="374" fill="#9be9a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">http://127.0.0.1:7897</text>
  <text x="224" y="438" fill="#7fb0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700">HTTPS_PROXY</text>
  <text x="414" y="438" fill="#aeb8c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">=</text>
  <text x="438" y="438" fill="#9be9a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">http://127.0.0.1:7897</text>

  <rect x="111" y="511" width="978" height="36" rx="18" fill="#2b3441"/>
  <circle cx="135" cy="529" r="6" fill="#1262e8"/>
  <text x="154" y="536" fill="#b9c3d1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16">7897 是示例端口，请替换为代理软件显示的 HTTP 或 Mixed 端口</text>

  <text x="78" y="625" fill="#677180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17">注意：HTTPS_PROXY 的值使用 http:// 是常见且正确的写法，它描述的是“如何连接到代理”。</text>
</svg>
